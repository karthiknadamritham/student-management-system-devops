name: Student Management System CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: devopsstudents
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Wait for MySQL to be ready
        run: |
          until nc -z -v -w30 localhost 3306; do
            echo "Waiting for MySQL..."
            sleep 5
          done
          echo "MySQL is up and running!"

      - name: Build and test with Maven
        run: mvn clean verify -B

      - name: Build Docker image (Backend)
        run: docker build -t myrepo/sms-app:${{ github.sha }} .

      - name: Build Docker image (Frontend)
        run: docker build -t myrepo/sms-frontend:${{ github.sha }} ./frontend

      # The Push and Deploy steps are mocked/commented since this is a local setup
